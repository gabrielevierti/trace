[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-evidence"
version = "0.3.0"
description = "Explainable digital evidence correlation and artifact analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gabriele V. / TRACE contributors"}]

dependencies = []

[project.scripts]
trace = "trace_evidence.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
