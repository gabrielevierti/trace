[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-evidence"
version = "1.0.0"
description = "Explainable digital evidence correlation and investigation toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Gabriele Vieri"}]
dependencies = []

[project.scripts]
trace = "trace_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["trace_evidence*"]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
