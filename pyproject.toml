[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-evidence"
version = "0.1.0"
description = "Explainable digital evidence correlation engine"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gabriele Vierti"}]
dependencies = []

[project.scripts]
trace = "trace_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["trace*"]
